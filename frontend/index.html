<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TopFlop</title>

    <style>
      html {
        background: #121212;
      }

      #root {
        visibility: hidden;
      }

      #splash {
        position: fixed;
        inset: 0;
        background: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }

      #splash span {
        font-family: 'Caesar Dressing', sans-serif;
        font-size: 3.4rem;
        letter-spacing: 1px;
        opacity: 0;
        transform: scale(0.96);
        animation: splashFade 0.4s ease forwards;
      }

      #splash .top {
        color: #E8B04A;
      }

      #splash .flop {
        color: #F5F5F5;
      }

      @keyframes splashFade {
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
    </style>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.1/css/all.min.css"
      integrity="sha512-MV7K8+y+gLIBoVD59lQIYicR65iaqukzvf/nwasF0nqhPay5w/9lJmVM2hMDcnK1OnMGCdVK+iQrJ7lzPJQd1w=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caesar+Dressing&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="splash">
      <span class="top">Top</span><span class="flop">Flop</span>
    </div>

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
